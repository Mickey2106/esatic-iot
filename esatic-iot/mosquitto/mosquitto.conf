# Port MQTT classique (capteur)
listener 1883
protocol mqtt

# Port WebSocket (tableau de bord dans le navigateur)
listener 9001
protocol websockets

# Mode démo : connexions anonymes autorisées.
# Pour sécuriser : allow_anonymous false + password_file (voir README, section Sécurité)
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
